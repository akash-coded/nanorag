[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorag"
version = "1.0.0"
description = "A runnable retrieval / RAG / evaluation teaching toolkit that runs entirely in memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "the maintainers" }]
keywords = ["rag", "retrieval", "evaluation", "bm25", "reranking", "bedrock", "teaching"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2.2.6", "matplotlib>=3.10.9", "pandas>=2.3.3"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
neural  = ["sentence-transformers>=2.6"]
claude  = ["anthropic>=1.2.0"]
dev     = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.6", "nbclient>=0.11.0", "nbformat>=5.10",
           "jupyterlab>=4.2"]

[project.urls]
Homepage      = "https://github.com/akash-coded/nanorag"
Documentation = "https://github.com/akash-coded/nanorag/tree/main/docs"
Discussions   = "https://github.com/akash-coded/nanorag/discussions"
Issues        = "https://github.com/akash-coded/nanorag/issues"

[tool.setuptools.packages.find]
include = ["nanorag*"]

[tool.pytest.ini_options]
# labs/ carries its own meta-tests: every reference solution must pass its own
# checks, and every starter must fail. A lab that cannot be completed, or one
# with nothing to do, is worse than no lab.
testpaths = ["tests", "labs"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a few seconds (deselect with '-m \"not slow\"')",
  "notebooks: executes notebooks end to end",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E741",   # ambiguous variable name — `l` for a label reads fine in short comprehensions
  "B008",   # function call in default argument — not a pattern we use
  "B905",   # zip() without strict= — we zip equal-length sequences by construction and the
            # explicit strict=False everywhere adds noise without catching anything here
  "B007",   # unused loop variable — tuple unpacking for readability is deliberate
  "C416",   # "unnecessary" comprehension — sometimes the explicit form documents intent
]

[tool.ruff.lint.per-file-ignores]
# Seeded GitHub content is prose in string literals; wrapping it to 100 columns would
# reflow markdown that is meant to be read on GitHub.
"scripts/seed_content.py" = ["E501"]
# Tests name things for legibility, not brevity.
"tests/*" = ["E501"]
# Lab check messages are prose written for a learner mid-problem. Wrapping them to
# 100 columns breaks the sentence a person reads when their solution fails, which is
# the one place in this repository where the message matters more than the layout.
"labs/*/checks.py" = ["E501"]
# Lab briefs and starters are read as much as run; the starter docstrings carry the
# spec and reflowing them to fit a linter makes the task harder to read. F401 is
# deliberate too: an unused `import hashlib` in a starter is the hint that the
# solution needs hashing, and removing it removes the hint.
"labs/*/starter.py" = ["E501", "F401"]

[tool.coverage.run]
source = ["nanorag"]
omit = ["nanorag/bedrock.py"]      # network path, exercised only in integration
