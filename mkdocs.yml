site_name: nanorag
site_description: >-
  The whole retrieval stack — BM25, dense, ANN, fusion, reranking, evaluation —
  with no vector database, no framework and no API key.
site_url: https://akash-coded.github.io/nanorag/
repo_url: https://github.com/akash-coded/nanorag
repo_name: akash-coded/nanorag
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: _site_docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akash-coded/nanorag

# Warnings are expected: several documents link out to notebooks/ and to the
# repository root, which live outside docs_dir. Those links are correct on
# GitHub, which is the primary reading surface. Do not build with --strict.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

