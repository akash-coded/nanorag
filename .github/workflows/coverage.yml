# Five test files existed with no visible coverage number. A test suite whose
# coverage nobody can see is a test suite nobody trusts.
name: Coverage
on:
  push: { branches: [main], paths: ["nanorag/**", "tests/**", ".github/workflows/coverage.yml"] }
  pull_request: { paths: ["nanorag/**", "tests/**"] }
permissions:
  contents: read
  pull-requests: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest --cov=nanorag --cov-report=term-missing --cov-report=json:coverage.json -q
      - name: Summarise
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("coverage.json").read_text())
          total = d["totals"]["percent_covered"]
          print(f"## Coverage: {total:.1f}%\n")
          print("| Module | Statements | Missing | Covered |")
          print("|---|---:|---:|---:|")
          rows = sorted(d["files"].items(),
                        key=lambda kv: kv[1]["summary"]["percent_covered"])
          for name, f in rows:
              s = f["summary"]
              print(f"| `{name}` | {s['num_statements']} | {s['missing_lines']} "
                    f"| {s['percent_covered']:.0f}% |")
          PY
