# The commit history already follows Conventional Commits. Squash-merge uses the
# PR title as the commit subject, so the title is the only place it can break.
name: PR title
on:
  pull_request_target: { types: [opened, edited, synchronize, reopened] }
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start lower-case, so the squashed
            commit reads as one sentence: "fix: green main", not "fix: Green main".
