# Closes the loop from Discussions back into the docs.
#
# Discussions are where the real questions get answered; docs are where people
# look first. Without something joining them, an answer is findable only by
# someone who already knew to search Discussions — so the question gets asked
# again and the thread that answered it is wasted.
#
# Weekly, and on demand. Opens a PR rather than committing to main, because a
# generated docs change should still be read by someone.
name: FAQ and map
on:
  schedule: [{ cron: "0 7 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  discussions: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Harvest answered discussions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/harvest_faq.py

      - name: Regenerate the discussion map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discussion_map.py
      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- docs/90-reference/faq.md docs/50-community/discussion-map.md; then
            echo "no new threads or answers since the last run"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="docs/faq-$(git rev-parse --short HEAD)"
          git switch -c "$branch"
          git add docs/90-reference/faq.md docs/50-community/discussion-map.md
          git commit -m "docs: refresh the FAQ and the discussion map"
          git push -u origin "$branch"
          gh pr create --title "docs: refresh the FAQ and the discussion map" \
            --body "Generated by \`scripts/harvest_faq.py\`. Threads whose answer was marked since the last run are now in \`docs/90-reference/faq.md\`.

          The extract is the opening of the accepted answer with the meta-commentary stripped. The thread stays the source of truth — edit the thread, not this file." \
            --label "type: docs" --label "area: docs"
