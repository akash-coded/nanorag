# 76 markdown files across seven groups need consistent structure. Heading-level
# skips and stale link text are invisible in review and obvious to a reader.
name: Markdown
on:
  push: { paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdown.yml"] }
  pull_request: { paths: ["**/*.md", ".markdownlint-cli2.jsonc"] }
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#tools/node_modules" "#_site_docs"
