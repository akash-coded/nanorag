name: Docs links
on:
  push:
    paths: ["**/*.md", "tools/check_links.py", ".github/workflows/link-check.yml"]
  pull_request:
    paths: ["**/*.md", "tools/check_links.py"]
  schedule: [{ cron: "30 5 * * 0" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Check relative links resolve
        run: python tools/check_links.py
