# Reviews and RUNS a lab solution posted in a discussion, then replies.
#
# SECURITY -- read before editing
# -------------------------------
# Anyone can comment on a public discussion, so the comment body is UNTRUSTED.
# Executing it is remote code execution on the runner unless the execution has
# nothing to reach and nothing to steal. So:
#
#   review   permissions: discussions:write   reads the code with the AST, never runs it
#   execute  permissions: {}                  the ONLY job that runs the code, inside
#                                              docker --network=none --read-only
#                                              --cap-drop=ALL, as an unprivileged user,
#                                              with a 30s kill. It has NO token: the
#                                              GITHUB_TOKEN it is issued has zero scopes.
#   post     permissions: discussions:write   never touches the code; reads a JSON
#                                              artifact and posts it
#
# The body never reaches a shell command line -- it is passed by environment
# variable into a file, so backticks and $(...) in a comment are text.
name: Lab submissions
on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
permissions: {}
concurrency:
  group: lab-${{ github.event.discussion.number }}-${{ github.event.comment.id || 'root' }}
  cancel-in-progress: false

jobs:
  triage:
    # Which lab, and is this a submission we should act on at all.
    if: >
      (startsWith(github.event.discussion.title, '[submit · ') ||
       startsWith(github.event.discussion.title, '[arena · ')) &&
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.body, 'lab-submission-review')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      lab: ${{ steps.id.outputs.lab }}
    steps:
      - id: id
        env:
          TITLE: ${{ github.event.discussion.title }}
        run: |
          LAB=$(printf '%s' "$TITLE" | grep -oE '[LC][0-9]{2}' | head -1)
          echo "lab=$LAB" >> "$GITHUB_OUTPUT"
          echo "lab: ${LAB:-none}"

  execute:
    # Runs the submission. This job has no credentials and the container has no network.
    needs: triage
    if: needs.triage.outputs.lab != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Capture the submission (env var -> file, never a command line)
        env:
          BODY: ${{ github.event.comment.body || github.event.discussion.body }}
        run: printenv BODY > submission.md

      - name: Extract the code block, or the bare value for a predict challenge
        run: |
          python3 - <<'PY'
          import re, pathlib
          body = pathlib.Path("submission.md").read_text(encoding="utf-8")
          blocks = re.findall(r"```(?:python|py)?\s*\n(.*?)```", body, re.S)
          if blocks:
              code = max(blocks, key=len)
          else:
              # predict-format: the whole comment may just be a word or a number
              value = body.strip().strip("`'\"")
              code = f"ANSWER = {value!r}\n" if value and len(value) < 60 else ""
          pathlib.Path("submission.py").write_text(code, encoding="utf-8")
          print(f"{len(code)} chars of submission")
          PY

      - name: Run inside a sealed container
        id: run
        env:
          LAB: ${{ needs.triage.outputs.lab }}
        run: |
          set +e
          # No -e/--env-file: the container inherits NOTHING from this shell.
          docker run --rm \
            --network=none --read-only --tmpfs /tmp:rw,size=32m \
            --memory=256m --memory-swap=256m --cpus=1 --pids-limit=64 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user=65534:65534 \
            -v "$PWD:/repo:ro" -w /repo \
            python:3.12-slim \
            timeout --signal=KILL 30 \
              python scripts/lab_sandbox.py --lab "$LAB" --submission /repo/submission.py \
            > stdout.txt 2> stderr.txt
          code=$?
          # Only the sentinel-prefixed last line is trusted as the report.
          grep -a '^@@LAB-REPORT@@' stdout.txt | tail -1 | sed 's/^@@LAB-REPORT@@//' > report.json
          if [ ! -s report.json ]; then
            printf '{"lab":"%s","error":"no report (exit %s)"}' "$LAB" "$code" > report.json
          fi
          echo "exit=$code"; head -c 400 stderr.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: lab-report-${{ github.run_id }}
          path: report.json
          retention-days: 1

  post:
    # Reads the report and replies. Never sees the submission.
    needs: [triage, execute]
    if: needs.triage.outputs.lab != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          name: lab-report-${{ github.run_id }}

      - name: Render the reply from the report
        run: python scripts/lab_submission.py --report report.json --out reply.md

      - name: Record the attempt on the Hands-on Tracker
        # A workflow-issued token cannot write to a user-owned project, so this one
        # step -- and only this step -- uses the PROJECT_TOKEN secret. It never sees
        # the submission; it reads the same JSON report the reply was rendered from.
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          LEARNER: ${{ github.event.sender.login }}
          LAB: ${{ needs.triage.outputs.lab }}
          THREAD: ${{ github.event.comment.html_url || github.event.discussion.html_url }}
        run: |
          PASSED=$(python3 -c "import json;r=json.load(open('report.json'));print('--passed' if r.get('passed')==r.get('total') and 'error' not in r else '')")
          python scripts/tracker.py --learner "$LEARNER" --item "$LAB" --thread "$THREAD" $PASSED \
            || echo "::warning::tracker update failed (is PROJECT_TOKEN set with the project scope?)"

      - name: Reply in the thread
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reply.md', 'utf8');
            await github.graphql(`
              mutation($d:ID!, $b:String!, $p:ID) {
                addDiscussionComment(input:{discussionId:$d, body:$b, replyToId:$p}) { comment { url } }
              }`, {
                d: context.payload.discussion.node_id,
                b: body,
                p: context.payload.comment?.node_id ?? null,
              });
