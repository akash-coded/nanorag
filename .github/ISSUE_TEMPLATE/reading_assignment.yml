name: 📚 Reading assignment
description: "Faculty only — publish a reading assignment for a cohort"
title: "[reading] Week __ — "
labels: ["type: reading", "cohort"]
body:
  - type: input
    id: week
    attributes: { label: "Week / session", placeholder: "Week 3 — retrieval methods" }
    validations: { required: true }
  - type: textarea
    id: required
    attributes:
      label: Required reading
      description: "Link, and one sentence on what to look for. Never assign a paper without saying why."
      value: |
        1. **[Title](url)** — what to look for:
        2. **[Title](url)** — what to look for:
    validations: { required: true }
  - type: textarea
    id: optional
    attributes: { label: "Optional / going deeper" }
  - type: textarea
    id: questions
    attributes:
      label: Questions to answer in the thread
      description: "Post answers as comments. These become the seminar agenda."
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: input
    id: due
    attributes: { label: "Due before", placeholder: "the Day 3 session" }
