version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: ["type: chore", "dependencies"]
    groups:
      scientific-python:
        patterns: ["numpy", "pandas", "matplotlib"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    labels: ["type: chore", "dependencies"]
    commit-message:
      prefix: "chore(ci)"
