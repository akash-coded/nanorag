# Auto-label PRs by what they touch, so the board and the reviewers route themselves.
"area: notebooks":
  - changed-files: [{ any-glob-to-any-file: "notebooks/**" }]
"area: toolkit":
  - changed-files: [{ any-glob-to-any-file: "nanorag/**" }]
"area: retrieval":
  - changed-files: [{ any-glob-to-any-file: ["nanorag/retrieve.py", "nanorag/store.py", "nanorag/embed.py", "nanorag/chunking.py"] }]
"area: evaluation":
  - changed-files: [{ any-glob-to-any-file: ["nanorag/metrics.py", "nanorag/judge.py", "nanorag/pipeline.py", ".github/eval-baseline.json"] }]
"area: agent":
  - changed-files: [{ any-glob-to-any-file: "nanorag/agent.py" }]
"area: cost":
  - changed-files: [{ any-glob-to-any-file: "nanorag/costs.py" }]
"area: docs":
  - changed-files: [{ any-glob-to-any-file: ["docs/**", "*.md"] }]
"area: ci":
  - changed-files: [{ any-glob-to-any-file: [".github/**", "Makefile", "pyproject.toml"] }]
"area: bedrock":
  - changed-files: [{ any-glob-to-any-file: "nanorag/bedrock.py" }]
"needs: eval-numbers":
  - changed-files: [{ any-glob-to-any-file: ["nanorag/retrieve.py", "nanorag/metrics.py", "nanorag/corpus.py", "nanorag/chunking.py", "nanorag/embed.py"] }]
