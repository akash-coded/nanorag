title: "[paper] "
labels: ["cohort"]
body:
  - type: markdown
    attributes:
      value: |
        One paper per thread. The house position: **replicate, do not cite.** A paper we can
        re-run against this corpus is worth more argued about with numbers than without.
  - type: input
    id: paper
    attributes:
      label: Paper
      placeholder: "Liu et al. (2023), Lost in the Middle — arXiv:2307.03172"
    validations: { required: true }
  - type: textarea
    id: claim
    attributes:
      label: The claim, in one paragraph
      description: What does it assert, and on what evidence?
    validations: { required: true }
  - type: textarea
    id: replication
    attributes:
      label: How would we test it here?
      description: >-
        Which notebook, which cell, which metric. If it cannot be tested against this corpus,
        say so — that is a finding about the paper's scope.
    validations: { required: true }
  - type: textarea
    id: questions
    attributes:
      label: Two or three things to argue about
    validations: { required: true }
